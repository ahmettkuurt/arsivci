name: Release DMG

# main'e kod içeren her gönderimde sürüm otomatik bir artar (1.1.0 → 1.1.1),
# Arşivci derlenir, DMG oluşturulur ve GitHub Releases'e yüklenir.
# Büyük sürüm atlamak için VERSION dosyasını değiştirin (ör. 2.0.0).
# Yalnızca belge değişiklikleri (README, docs/) yeni sürüm oluşturmaz.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE*", ".gitignore"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Sürüm (boş bırakılırsa otomatik artar)"
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # önceki sürüm etiketleri ve değişiklik listesi için

      - name: Sürümü belirle
        id: ver
        run: |
          LAST="$(git tag -l 'v*' --sort=-v:refname | head -1)"
          LAST="${LAST#v}"; [ -z "$LAST" ] && LAST="0.0.0"
          FILEV="$(tr -d '[:space:]' < VERSION)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            V="${{ github.event.inputs.version }}"
          elif [ "$(printf '%s\n%s\n' "$LAST" "$FILEV" | sort -V | tail -1)" != "$LAST" ]; then
            V="$FILEV"            # VERSION dosyası son sürümden ileride: onu kullan
          else
            IFS=. read -r MA MI PA <<< "$LAST"
            V="$MA.$MI.$((PA + 1))"   # otomatik artır
          fi
          echo "Önceki: $LAST → Yeni: $V"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "last=$LAST" >> "$GITHUB_OUTPUT"

      - name: Uygulamayı derle
        run: |
          swift --version
          bash scripts/build-app.sh "${{ steps.ver.outputs.version }}"

      - name: DMG oluştur
        run: |
          python3 -m pip install --quiet --break-system-packages dmgbuild || python3 -m pip install --quiet dmgbuild
          # Retina arka planı 144 DPI olmalı; yoksa Finder resmi iki kat büyük gösterir
          cp Resources/dmg-background.png build/bg.png && cp Resources/dmg-background@2x.png build/bg@2x.png
          sips -s dpiWidth 72 -s dpiHeight 72 build/bg.png >/dev/null
          sips -s dpiWidth 144 -s dpiHeight 144 build/bg@2x.png >/dev/null
          tiffutil -cathidpicheck build/bg.png build/bg@2x.png -out build/background.tiff
          python3 -m dmgbuild -s scripts/dmg-settings.py \
            -D app="build/Arşivci.app" \
            -D background=build/background.tiff \
            "Arşivci" build/Arsivci.dmg
          hdiutil verify build/Arsivci.dmg
          ls -lh build/Arsivci.dmg

      - name: Sürüm notları
        run: |
          cat > build/notes.md <<'EOF'
          ## Arşivci — Ahmet Kurt tarafından yapıldı

          Mac için her dosya türüyle çalışan arşiv uygulaması: **sıkıştır · aç · çıkar**.

          7-Zip uygulamanın içinde gelir; ek kurulum gerekmez.

          ### İndir ve kur
          1. Aşağıdaki **Arsivci.dmg** dosyasını indirin ve çift tıklayın.
          2. Açılan pencerede **Arşivci**'yi **Uygulamalar** kartına sürükleyin.
          3. İlk açılışta "Apple doğrulayamadı" uyarısı çıkarsa:
             **Sistem Ayarları → Gizlilik ve Güvenlik → yine de Aç**.

          macOS 13 (Ventura) veya üstü · Apple Silicon ve Intel

          ### Bu sürümdeki değişiklikler
          EOF
          if git rev-parse -q --verify "refs/tags/v${{ steps.ver.outputs.last }}" >/dev/null; then
            RANGE="v${{ steps.ver.outputs.last }}..HEAD"
          else
            RANGE="HEAD"
          fi
          git log "$RANGE" --no-merges --format='- %s' | grep -v -E '^- Sürüm [0-9.]+$' >> build/notes.md || true

      - name: GitHub Release'e yükle
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Arşivci ${{ steps.ver.outputs.version }}
          body_path: build/notes.md
          files: build/Arsivci.dmg
          make_latest: true
