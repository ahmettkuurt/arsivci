name: Build

# Her gönderimde uygulamanın derlendiğini ve DMG'nin oluştuğunu kontrol eder (yayınlamaz).
on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "VERSION"]
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Uygulamayı derle
        run: |
          swift --version
          bash scripts/build-app.sh 0.0.0-ci
      - name: Gömülü 7-Zip'i kontrol et
        run: |
          "build/Arşivci.app/Contents/MacOS/7zz" i | head -5
          lipo -archs "build/Arşivci.app/Contents/MacOS/Arsivci"
      - name: DMG oluştur
        run: |
          python3 -m pip install --quiet --break-system-packages dmgbuild || python3 -m pip install --quiet dmgbuild
          # Retina arka planı 144 DPI olmalı; yoksa Finder resmi iki kat büyük gösterir
          cp Resources/dmg-background.png build/bg.png && cp Resources/dmg-background@2x.png build/bg@2x.png
          sips -s dpiWidth 72 -s dpiHeight 72 build/bg.png >/dev/null
          sips -s dpiWidth 144 -s dpiHeight 144 build/bg@2x.png >/dev/null
          tiffutil -cathidpicheck build/bg.png build/bg@2x.png -out build/background.tiff
          python3 -m dmgbuild -s scripts/dmg-settings.py -D app="build/Arşivci.app" -D background=build/background.tiff "Arşivci" build/Arsivci.dmg
          hdiutil verify build/Arsivci.dmg
          ls -lh build/Arsivci.dmg
