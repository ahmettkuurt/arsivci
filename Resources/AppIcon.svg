    <rect x="480" y="566" width="17" height="13" rx="2"/><rect x="513" y="587" width="17" height="13" rx="2"/>
    <rect x="480" y="608" width="17" height="13" rx="2"/><rect x="513" y="629" width="17" height="13" rx="2"/>
    <rect x="480" y="650" width="17" height="13" rx="2"/><rect x="513" y="671" width="17" height="13" rx="2"/>
    <rect x="480" y="692" width="17" height="13" rx="2"/><rect x="513" y="713" width="17" height="13" rx="2"/>
