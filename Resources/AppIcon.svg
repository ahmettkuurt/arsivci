    <circle cx="230" cy="230" r="9"/><circle cx="300" cy="230" r="9"/><circle cx="230" cy="300" r="9"/>
    <circle cx="794" cy="794" r="9"/><circle cx="724" cy="794" r="9"/><circle cx="794" cy="724" r="9"/>
  </g>

